<!DOCTYPE html>
<html>
<head>
    <title>PhishBuddy</title>
    <style>
        body {
            font-family: "Courier New", monospace;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }

        input {
            padding: 10px;
            width: 70%;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
        }

        #results {
            margin-top: 30px;
            padding: 15px;
            border-radius: 5px;
            display: none;
        }

        #results.low {
            background: #4caf50;
            color: white;
        }

        #results.medium {
            background: #ff9800;
            color: white;
        }

        #results.high {
            background: #ff5722;
            color: white;
        }

        #results.critical {
            background: #f44336;
            color: white;
        }

        #results.error {
            background: #9c27b0;
            color: white;
        }
    </style>
</head>
<body>
    <h1>PhishBuddy</h1>

    <input type="text" id="urlInput" placeholder="Enter URL">
    <button onclick="checkURL()">Check</button>

    <div id="results"></div>

    <script>
        async function checkURL() {
            const url = document.getElementById('urlInput').value;
            if (!url) return;

            try {
                const res = await fetch('/api/check', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({url: url})
                });

                const data = await res.json();
                const resultsDiv = document.getElementById('results');
                resultsDiv.className = '';

                if (res.ok) {
                    const verdict = data.verdict.toLowerCase();
                    resultsDiv.classList.add(verdict);
                    resultsDiv.innerHTML = `
                        <h2>Verdict: ${data.verdict}</h2>
                        <p>Score: ${data.risk_score}/100</p>
                        <h3>Reasons:</h3>
                        <ul>${data.reasons.map(r => `<li>${r}</li>`).join('')}</ul>
                    `;
                } else {
                    resultsDiv.classList.add('error');
                    resultsDiv.innerHTML = `<p>Error: ${data.error}</p>`;
                }
                resultsDiv.style.display = 'block';
            } catch (e) {
                const resultsDiv = document.getElementById('results');
                resultsDiv.classList.add('error');
                resultsDiv.innerHTML = `<p>Error: ${e.message}</p>`;
                resultsDiv.style.display = 'block';
            }
        }
    </script>
</body>
</html>
